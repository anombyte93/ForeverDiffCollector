name: Check addon
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: bash ops/test-addon.sh
      - run: python3 ops/build-addon.py
      - run: python3 ops/test-release-version.py
      - name: Require a new version for release changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ops/check-release-version.py
